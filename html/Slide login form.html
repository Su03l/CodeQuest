<!DOCTYPE html>
<html>
  <head>
    <title>CodeQuest - Login</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Jost:wght@500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
  </head>
  <style>
    /* Toast & Modal Styles */
    #toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 10000;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .toast {
      background: white;
      color: #333;
      padding: 15px 25px;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 300px;
      transform: translateX(120%);
      transition: transform 0.3s ease;
      border-left: 5px solid #667eea;
    }
    .toast.show {
      transform: translateX(0);
    }
    .toast.success {
      border-left-color: #2ecc71;
    }
    .toast.success i {
      color: #2ecc71;
      font-size: 1.5rem;
    }
    .toast.error {
      border-left-color: #e74c3c;
    }
    .toast.error i {
      color: #e74c3c;
      font-size: 1.5rem;
    }
    .toast span {
      font-size: 1rem;
      font-weight: 500;
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 2000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      align-items: center;
      justify-content: center;
    }
    .modal.show {
      display: flex;
    }
    .modal-content {
      background-color: white;
      padding: 2rem;
      border-radius: 15px;
      width: 90%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 15px 50px rgba(0, 0, 0, 0.2);
      animation: modalSlideIn 0.3s ease;
    }
    @keyframes modalSlideIn {
      from {
        transform: translateY(-20px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }
    .modal-actions {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 20px;
    }
    .modal-actions button {
      width: auto;
      margin: 0;
      padding: 10px 20px;
    }
    .btn-secondary {
      background: transparent;
      color: #666;
      border: 2px solid #ddd;
    }
    .btn-secondary:hover {
      background: #f0f0f0;
      color: #333;
    }

    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: "Jost", sans-serif;
      background: linear-gradient(to bottom, #0f0c29, #302b63, #24243e);
    }
    .main {
      width: 350px;
      height: 500px;
      background: red;
      overflow: hidden;
      background: url("https://img.freepik.com/premium-vector/abstract-realistic-technology-particle-background_23-2148414765.jpg?w=740")
        no-repeat center/ cover;
      border-radius: 10px;
      box-shadow: 5px 20px 50px #000;
    }
    #chk {
      display: none;
    }
    .signup {
      position: relative;
      width: 100%;
      height: 100%;
    }
    label {
      color: #fff;
      font-size: 2.3em;
      justify-content: center;
      display: flex;
      margin: 60px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.5s ease-in-out;
    }
    input {
      width: 60%;
      height: 20px;
      background: #e0dede;
      justify-content: center;
      display: flex;
      margin: 20px auto;
      padding: 10px;
      border: none;
      outline: none;
      border-radius: 5px;
    }
    button {
      width: 60%;
      height: 40px;
      margin: 10px auto;
      justify-content: center;
      display: block;
      color: #fff;
      background: #573b8a;
      font-size: 1em;
      font-weight: bold;
      margin-top: 20px;
      outline: none;
      border: none;
      border-radius: 5px;
      transition: 0.2s ease-in;
      cursor: pointer;
    }
    button:hover {
      background: #6d44b8;
    }
    button:disabled {
      background: #888;
      cursor: not-allowed;
    }
    .login {
      height: 460px;
      background: #eee;
      border-radius: 60% / 10%;
      transform: translateY(-180px);
      transition: 0.8s ease-in-out;
    }
    .login label {
      color: #573b8a;
      transform: scale(0.6);
    }

    #chk:checked ~ .login {
      transform: translateY(-500px);
    }
    #chk:checked ~ .login label {
      transform: scale(1);
    }
    #chk:checked ~ .signup label {
      transform: scale(0.6);
    }
    .back-home-btn {
      position: absolute;
      top: 20px;
      left: 20px;
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.1);
      color: white;
      text-decoration: none;
      border-radius: 25px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      font-size: 0.9em;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .back-home-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      border-color: rgba(255, 255, 255, 0.5);
      transform: translateY(-2px);
    }
    .back-home-btn i {
      font-size: 1.1em;
    }
  </style>
  <body>
    <a href="Index.html" class="back-home-btn">
      <i class="fas fa-home"></i> Back to Home
    </a>
    <div class="main">
      <input type="checkbox" id="chk" aria-hidden="true" />

      <div class="signup">
        <form id="signup-form">
          <label for="chk" aria-hidden="true">Sign up</label>
          <input
            type="text"
            id="signup-username"
            name="txt"
            placeholder="User name"
            required=""
          />
          <input
            type="email"
            id="signup-email"
            name="email"
            placeholder="Email"
            required=""
          />
          <input
            type="password"
            id="signup-password"
            name="pswd"
            placeholder="Password"
            required=""
          />
          <button type="submit">Sign up</button>
        </form>
      </div>

      <div class="login">
        <form id="login-form">
          <label for="chk" aria-hidden="true">Login</label>
          <input
            type="email"
            id="login-email"
            name="email"
            placeholder="Email"
            required=""
          />
          <input
            type="password"
            id="login-password"
            name="pswd"
            placeholder="Password"
            required=""
          />
          <button type="submit">Login</button>
        </form>
      </div>
    </div>

    <!-- Supabase Client Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Supabase Integration -->
    <script src="supabase-client.js"></script>
    <script src="ui.js"></script>
    <script src="auth.js"></script>
  </body>
</html>
